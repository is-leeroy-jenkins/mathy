name: Package validation

on:
  pull_request:
  push:
    branches: [main, fix/predictive-preprocessing-validation]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Inspect wheel and source imports
        run: |
          python -m compileall -q .

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('dist').glob('*.whl'))

          with ZipFile(wheel) as archive:
              paths = set(archive.namelist())

              assert 'mathy/__init__.py' in paths
              assert 'mathy/classifications.py' in paths
              assert 'mathy/app.py' in paths
              assert 'mathy/cli.py' in paths

          print('Wheel contains the Mathy package and UI.')
          PY

  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sklearn: ['1.7.*', '1.8.*']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and estimator version
        run: python -m pip install . "scikit-learn==${{ matrix.sklearn }}"
      - name: Verify installed package imports
        working-directory: ${{ runner.temp }}
        run: python -c "import mathy; from mathy import classifications, regressions, features, data; from mathy.boogr import Error, Logger"
      - name: Execute regression suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
